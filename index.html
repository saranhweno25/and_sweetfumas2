<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone風ミニゲーム</title>
<style>
:root {
  --lock-wall: linear-gradient(145deg,#25232d,#81768c 45%,#171720 82%);
  --home-wall: linear-gradient(150deg,#e8dfe6,#efd3df 48%,#d8cbd9);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100dvh; display:grid; place-items:center;
  background:#101014; color:white;
}
button { font:inherit; cursor:pointer; }
.phone {
  position:relative; width:min(100vw,430px); height:min(100dvh,932px);
  overflow:hidden; background:#111; isolation:isolate;
}
@media (min-width:500px) {
  .phone { border:7px solid #29292d; border-radius:50px; box-shadow:0 20px 70px #0009; }
}
.wall {
  position:absolute; inset:0; z-index:-2; background-size:cover;
  background-position:center; transition:background .2s;
}
.wall.lock { background:var(--lock-wall); }
.wall.home { background:var(--home-wall); }
.wall.lock::after { content:""; position:absolute; inset:0; background:#08071226; }
.status {
  position:absolute; z-index:30; top:0; left:0; right:0; height:45px;
  padding:11px 24px 0; display:flex; justify-content:space-between;
  font-size:14px; font-weight:700; text-shadow:0 1px 5px #0008;
}
.status-right { letter-spacing:1px; }
.island {
  position:absolute; z-index:32; top:10px; left:50%; transform:translateX(-50%);
  width:112px; height:31px; border-radius:22px; background:#050505;
}
.screen { position:absolute; inset:0; display:none; }
.screen.active { display:block; }

/* ロック画面 */
#lockScreen { text-align:center; }
.lock-date { margin-top:100px; font-size:16px; text-shadow:0 1px 8px #0008; }
.lock-time { font-size:clamp(68px,19vw,92px); line-height:1.08; font-weight:650; letter-spacing:-4px; }
.lock-hint { position:absolute; bottom:91px; left:0; right:0; font-size:14px; }
.lock-shortcuts { position:absolute; bottom:27px; left:0; right:0; display:flex; justify-content:space-around; }
.shortcut { border:0; border-radius:50%; width:48px; height:48px; color:white; background:#ffffff55; font-size:21px; }

/* パスコード画面 */
#passScreen { text-align:center; background:#09090dbb; backdrop-filter:blur(22px); }
.pass-title { margin-top:143px; font-size:19px; }
.dots { display:flex; justify-content:center; gap:17px; margin:22px 0 38px; }
.dot { width:13px; height:13px; border:1.5px solid white; border-radius:50%; }
.dot.filled { background:white; }
.keypad { width:270px; margin:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:12px 14px; }
.key {
  width:78px; height:78px; border:0; border-radius:50%;
  color:white; background:#ffffff37; font-size:34px; font-weight:300;
}
.key:active { background:#ffffff70; }
.key small { display:block; font-size:8px; font-weight:700; letter-spacing:2px; margin-top:-2px; }
.key.zero { grid-column:2; }
.pass-bottom { position:absolute; bottom:65px; left:0; right:0; display:flex; justify-content:space-around; }
.text-button { border:0; background:none; color:white; font-size:14px; }
#error { height:19px; color:#ffb5b5; font-size:14px; margin-top:-29px; }

/* ホーム画面 */
#homeScreen { padding:65px 17px 115px; }
.home-widget {
  height:103px; padding:14px 16px; margin-bottom:21px; border-radius:23px;
  background:#ffffff66; color:#242229; backdrop-filter:blur(15px);
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:inset 0 0 0 1px #ffffff66;
}
.home-widget strong { font-size:18px; }
.home-widget span { font-size:12px; }
.app-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:17px 5px; }
.app-icon {
  position:relative; border:0; background:none; color:#111;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  min-width:0; font-size:11px; text-shadow:0 1px 3px #ffffffa8;
}
.app-icon .icon {
  position:relative; width:67px; height:67px; border-radius:18px;
  display:grid; place-items:center; overflow:visible;
  box-shadow:0 3px 8px #0002, inset 0 0 0 1px #ffffff55;
}
.app-icon .icon svg { width:100%; height:100%; display:block; }
.badge {
  position:absolute; right:-5px; top:-7px; min-width:27px; height:27px;
  padding:0 6px; border-radius:20px; background:#ff334b; color:white;
  font-size:15px; line-height:27px; text-align:center; text-shadow:none;
  box-shadow:0 1px 3px #0003;
}
.dock {
  position:absolute; bottom:24px; left:13px; right:13px; height:82px;
  border-radius:26px; background:#ffffff76; backdrop-filter:blur(17px);
  display:flex; justify-content:space-around; align-items:center;
}
.dock .app-icon .icon { width:55px; height:55px; }
.homebar {
  position:absolute; z-index:40; bottom:7px; left:50%; transform:translateX(-50%);
  width:135px; height:5px; background:white; border-radius:9px; cursor:pointer;
  box-shadow:0 1px 4px #0007;
}

/* 通常アプリの枠 */
#appScreen { background:#f4f4f6; color:#17171a; }
.app-top {
  height:88px; padding:49px 17px 8px; display:flex; align-items:center;
  justify-content:space-between; font-size:18px; font-weight:700;
}
.back { border:0; border-radius:50%; width:34px; height:34px; background:#e5e5e9; font-size:23px; }
.app-body { height:calc(100% - 120px); overflow:auto; padding:14px; }
.card { background:white; color:#202024; border-radius:16px; padding:16px; margin-bottom:12px; }
.mock-button { border:0; border-radius:12px; padding:11px 14px; background:#3478f6; color:white; margin:4px; }
.field { width:100%; border:0; border-radius:12px; padding:13px; background:#eee; font-size:16px; }
.photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.photo-tile { aspect-ratio:1; border-radius:4px; background:linear-gradient(135deg,#c9a9a3,#55536d,#222); overflow:hidden; }
.photo-tile img { width:100%; height:100%; object-fit:cover; }

/* Instagram */
#appScreen.instagram-mode { background:#fff; color:#111; }
#appScreen.instagram-mode .app-top { display:none; }
#appScreen.instagram-mode .app-body { height:100%; padding:0; overflow:hidden; }
.ig {
  height:100%; padding-top:42px; background:#fff; color:#111;
  display:flex; flex-direction:column; position:relative;
}
.ig-main { flex:1; overflow-y:auto; padding-bottom:7px; }
.ig-header {
  height:45px; padding:0 14px; display:flex; align-items:center;
  justify-content:space-between; font-size:21px;
}
.ig-logo { font-family:cursive; font-weight:700; letter-spacing:-1px; }
.ig-head-actions { display:flex; align-items:center; gap:18px; font-size:24px; }
.ig-head-actions button, .ig-nav button, .ig-post-actions button, .ig-profile-actions button {
  border:0; background:none; color:inherit; padding:0;
}
.story-row {
  display:flex; gap:13px; overflow-x:auto; padding:8px 12px 12px;
  border-bottom:1px solid #eee;
}
.story { flex:0 0 58px; text-align:center; font-size:10px; white-space:nowrap; }
.story-ring {
  width:55px; height:55px; border-radius:50%; padding:3px; margin:0 auto 4px;
  background:linear-gradient(45deg,#ffd35b,#f33872,#9b3de0);
}
.story-avatar {
  width:100%; height:100%; border-radius:50%; border:2px solid white;
  background:#e8e4eb; display:grid; place-items:center; overflow:hidden; color:#777;
}
.story-avatar img { width:100%; height:100%; object-fit:cover; }
.ig-post { border-bottom:1px solid #eee; }
.ig-post-header { height:47px; display:flex; align-items:center; padding:0 12px; gap:9px; font-size:12px; }
.ig-avatar-small {
  width:31px; height:31px; border-radius:50%; background:linear-gradient(45deg,#f6b54d,#df4181);
  display:grid; place-items:center; color:white; overflow:hidden; flex:none;
}
.ig-avatar-small img { width:100%; height:100%; object-fit:cover; }
.ig-post-picture {
  width:100%; aspect-ratio:1 / 1.02; max-height:470px; display:grid; place-items:center;
  overflow:hidden; background:linear-gradient(140deg,#ddc8b9,#8b7786,#283141);
  color:#fff; font-size:60px;
}
.ig-post-picture img { width:100%; height:100%; object-fit:cover; }
.ig-post-actions { display:flex; gap:14px; align-items:center; padding:9px 12px 4px; font-size:24px; }
.ig-post-actions .save { margin-left:auto; }
.ig-caption { padding:0 12px 12px; font-size:12px; line-height:1.5; }
.ig-nav {
  height:52px; flex:none; display:flex; justify-content:space-around; align-items:center;
  border-top:1px solid #eee; background:#fff;
}
.ig-nav button { width:20%; height:48px; font-size:22px; position:relative; }
.ig-nav button:disabled { opacity:.8; cursor:default; }
.ig-nav .active::after {
  content:""; position:absolute; width:4px; height:4px; border-radius:50%;
  background:#111; bottom:3px; left:50%; transform:translateX(-50%);
}
.ig-nav-avatar {
  width:23px; height:23px; border:1px solid #555; border-radius:50%;
  display:inline-grid; place-items:center; overflow:hidden; vertical-align:middle; font-size:13px;
}
.ig-nav-avatar img { width:100%; height:100%; object-fit:cover; }

/* Instagramプロフィール */
.ig-profile { padding:13px 15px 20px; }
.ig-username-row { display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:16px; margin-bottom:20px; }
.ig-profile-top { display:flex; align-items:center; gap:23px; }
.ig-profile-avatar {
  flex:none; width:83px; height:83px; border-radius:50%; overflow:hidden;
  background:#eee; display:grid; place-items:center; font-size:30px; color:#888;
}
.ig-profile-avatar img { width:100%; height:100%; object-fit:cover; }
.ig-stats { flex:1; display:flex; justify-content:space-around; text-align:center; font-size:12px; }
.ig-stats b { display:block; font-size:16px; }
.ig-name { font-size:13px; margin-top:12px; }
.ig-private { margin-top:7px; font-size:12px; color:#555; }
.ig-profile-actions { display:flex; gap:7px; margin:14px 0; }
.ig-profile-actions button {
  flex:1; border-radius:8px; background:#efeff0; padding:7px 4px; font-size:12px; font-weight:600;
}
.ig-highlight-row { display:flex; gap:17px; padding:8px 0 14px; }
.ig-highlight { text-align:center; font-size:10px; }
.ig-highlight-circle {
  width:54px; height:54px; border:1px solid #ccc; border-radius:50%;
  display:grid; place-items:center; margin-bottom:5px;
}
.ig-profile-tabs { display:flex; justify-content:space-around; border-top:1px solid #ddd; padding:11px 0; font-size:18px; }
.ig-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
.ig-grid-item { aspect-ratio:1; background:linear-gradient(135deg,#d8c5ba,#897c93,#353242); overflow:hidden; }
.ig-grid-item img { width:100%; height:100%; object-fit:cover; }

/* DM */
.dm-page { height:100%; display:flex; flex-direction:column; background:#fff; }
.dm-top { padding:9px 14px; border-bottom:1px solid #eee; font-weight:700; }
.dm-person { display:flex; align-items:center; gap:10px; padding:12px; border-bottom:1px solid #eee; }
.dm-messages { flex:1; overflow:auto; padding:16px 12px; display:flex; flex-direction:column; gap:9px; }
.dm-bubble { max-width:78%; padding:10px 13px; border-radius:18px; background:#efeff1; font-size:14px; align-self:flex-start; }
.dm-bubble.mine { background:#3797f0; color:white; align-self:flex-end; }
.dm-compose { display:flex; gap:8px; padding:9px 12px 14px; border-top:1px solid #eee; }
.dm-compose input { flex:1; min-width:0; border:1px solid #ddd; border-radius:20px; padding:10px 13px; font-size:14px; }
.dm-compose button { border:0; background:#3797f0; color:white; border-radius:18px; padding:0 14px; }
.ig-modal {
  position:absolute; inset:0; z-index:20; background:#000d; color:white;
  display:none; align-items:center; justify-content:center; flex-direction:column;
}
.ig-modal.show { display:flex; }
.ig-modal img { max-width:92%; max-height:75%; object-fit:contain; }
.ig-modal button { position:absolute; top:47px; right:20px; border:0; background:none; color:white; font-size:28px; }
</style>
</head>
<body>
<main class="phone" id="phone">
  <div class="wall lock" id="lockWall"></div>
  <div class="wall home" id="homeWall" style="display:none"></div>

  <div class="status">
    <span id="clockStatus">9:41</span>
    <span class="status-right">▮▮▮　◉　▰</span>
  </div>
  <div class="island"></div>

  <section class="screen active" id="lockScreen">
    <div class="lock-date" id="dateText"></div>
    <div class="lock-time" id="timeText"></div>
    <div class="lock-hint">上にスワイプしてロックを解除</div>
    <div class="lock-shortcuts">
      <button class="shortcut">◉</button><button class="shortcut">▣</button>
    </div>
  </section>

  <section class="screen" id="passScreen">
    <div class="pass-title">パスコードを入力</div>
    <div class="dots" id="dots"></div>
    <div id="error"></div>
    <div class="keypad" id="keypad"></div>
    <div class="pass-bottom">
      <button class="text-button" id="emergency">緊急</button>
      <button class="text-button" id="cancelPass">キャンセル</button>
    </div>
  </section>

  <section class="screen" id="homeScreen">
    <div class="home-widget">
      <div><strong>こんにちは</strong><br><span id="homeDate"></span></div>
      <span>☀️　22°</span>
    </div>
    <div class="app-grid" id="appGrid"></div>
    <div class="dock" id="dock"></div>
  </section>

  <section class="screen" id="appScreen">
    <div class="app-top">
      <button class="back" id="backHome">‹</button>
      <span id="appTitle"></span><span>•••</span>
    </div>
    <div class="app-body" id="appBody"></div>
  </section>

  <div class="homebar" id="homebar"></div>
  <input type="file" id="lockPicker" accept="image/*" hidden>
  <input type="file" id="homePicker" accept="image/*" hidden>
  <input type="file" id="feedPicker" accept="image/*" multiple hidden>
  <input type="file" id="profilePicker" accept="image/*" hidden>
</main>

<script>
const $ = s => document.querySelector(s);

const iconSvg = {
  messages: `<svg viewBox="0 0 100 100"><defs><linearGradient id="gmsg" x2="0" y2="1"><stop stop-color="#52ed75"/><stop offset="1" stop-color="#08bd45"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="25" fill="url(#gmsg)"/><path d="M20 47c0-17 13-28 31-28s30 11 30 27-13 27-30 27c-6 0-11-1-15-3L23 80l3-15c-4-5-6-11-6-18Z" fill="#f4fff5" stroke="#d8ffe0" stroke-width="3"/></svg>`,
  kakao: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="#ffdc00"/><ellipse cx="50" cy="45" rx="32" ry="25" fill="#392d20"/><path d="m32 62-5 18 21-14" fill="#392d20"/><text x="50" y="51" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffe600">TALK</text></svg>`,
  instagram: `<svg viewBox="0 0 100 100"><defs><linearGradient id="iggrad" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffd04a"/><stop offset=".45" stop-color="#ff315e"/><stop offset="1" stop-color="#8b35e8"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="25" fill="url(#iggrad)"/><rect x="23" y="23" width="54" height="54" rx="17" fill="none" stroke="white" stroke-width="7"/><circle cx="50" cy="50" r="13" fill="none" stroke="white" stroke-width="7"/><circle cx="69" cy="31" r="4" fill="white"/></svg>`,
  photos: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="white"/><g transform="translate(50 50)"><ellipse cy="-19" rx="9" ry="18" fill="#ff453a"/><ellipse cy="19" rx="9" ry="18" fill="#34c759"/><ellipse cx="-19" rx="18" ry="9" fill="#bf5af2"/><ellipse cx="19" rx="18" ry="9" fill="#ff9f0a"/><ellipse cx="-14" cy="-14" rx="9" ry="17" transform="rotate(-45 -14 -14)" fill="#0a84ff"/><ellipse cx="14" cy="-14" rx="9" ry="17" transform="rotate(45 14 -14)" fill="#ffd60a"/><ellipse cx="-14" cy="14" rx="9" ry="17" transform="rotate(45 -14 14)" fill="#5e5ce6"/><ellipse cx="14" cy="14" rx="9" ry="17" transform="rotate(-45 14 14)" fill="#30d158"/></g></svg>`,
  camera: `<svg viewBox="0 0 100 100"><defs><linearGradient id="cam" x2="0" y2="1"><stop stop-color="#ddd"/><stop offset="1" stop-color="#aaa"/></linearGradient><radialGradient id="lens"><stop stop-color="#d8faff"/><stop offset=".25" stop-color="#3487d8"/><stop offset=".65" stop-color="#111a35"/><stop offset="1" stop-color="#555"/></radialGradient></defs><rect x="2" y="2" width="96" height="96" rx="25" fill="url(#cam)"/><circle cx="50" cy="50" r="35" fill="#252833"/><circle cx="50" cy="50" r="29" fill="#111"/><circle cx="50" cy="50" r="23" fill="url(#lens)"/><circle cx="41" cy="40" r="6" fill="#fff" opacity=".8"/></svg>`,
  youtube: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="white"/><rect x="17" y="29" width="66" height="43" rx="13" fill="#ff1744"/><path d="M45 39v23l19-11.5Z" fill="white"/></svg>`,
  x: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="#050505"/><path d="M26 22h17l31 56H57L26 22Zm9 0 39 56h-8L27 22h8Zm40 0L35 78h9l40-56h-9Z" fill="white"/></svg>`,
  settings: `<svg viewBox="0 0 100 100"><defs><linearGradient id="set" x2="0" y2="1"><stop stop-color="#aaa"/><stop offset="1" stop-color="#555"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="25" fill="url(#set)"/><circle cx="50" cy="50" r="30" fill="none" stroke="#eee" stroke-width="8" stroke-dasharray="8 5"/><circle cx="50" cy="50" r="18" fill="none" stroke="#ddd" stroke-width="7"/><circle cx="50" cy="50" r="6" fill="#eee"/></svg>`,
  notes: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="#fff"/><path d="M3 27h94v13H3Z" fill="#ffd83d"/><path d="M18 54h64M18 70h64" stroke="#bbb" stroke-width="4" stroke-linecap="round"/></svg>`,
  calendar: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="white"/><path d="M3 27h94v14H3Z" fill="#ffd83d"/><text x="50" y="31" text-anchor="middle" font-size="10" fill="#555">月</text><text x="50" y="78" text-anchor="middle" font-size="42" fill="#222">2</text></svg>`,
  safari: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="white"/><circle cx="50" cy="50" r="38" fill="#188cf2"/><circle cx="50" cy="50" r="32" fill="none" stroke="#bce9ff" stroke-width="2"/><path d="m65 32-9 24-22 13 10-24Z" fill="white"/><path d="m65 32-9 24-12-11Z" fill="#ff334f"/></svg>`,
  music: `<svg viewBox="0 0 100 100"><defs><linearGradient id="mus" x2="0" y2="1"><stop stop-color="#ff5b79"/><stop offset="1" stop-color="#ee003c"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="25" fill="url(#mus)"/><path d="M61 22v43c0 9-21 13-21 2 0-8 11-11 19-9V31l22-5v34c0 9-21 13-21 2" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  phone: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="#32cf62"/><path d="M33 23c-5 0-10 7-8 15 5 20 21 36 40 40 8 2 15-4 15-10l-2-9-16-7-8 9c-8-4-14-10-18-18l8-8-7-12Z" fill="white"/></svg>`,
  mail: `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="25" fill="#39c9ed"/><path d="M20 31h60v42H20Z" fill="white"/><path d="m21 33 29 24 29-24" fill="none" stroke="#8ddcf3" stroke-width="5"/></svg>`
};

const apps = [
  {id:"messages",name:"メッセージ",icon:"messages",badge:"89"},
  {id:"kakao",name:"KakaoTalk",icon:"kakao"},
  {id:"instagram",name:"Instagram",icon:"instagram",badge:"10"},
  {id:"photos",name:"写真",icon:"photos"},
  {id:"messages",name:"メッセージ",icon:"messages",badge:"89"},
  {id:"camera",name:"カメラ",icon:"camera"},
  {id:"youtube",name:"YouTube",icon:"youtube"},
  {id:"x",name:"X",icon:"x"},
  {id:"settings",name:"設定",icon:"settings",badge:"3"},
  {id:"notes",name:"メモ",icon:"notes"},
  {id:"calendar",name:"カレンダー",icon:"calendar"},
  {id:"safari",name:"Safari",icon:"safari"},
  {id:"music",name:"ミュージック",icon:"music"}
];
const dockApps = [
  {id:"phone",name:"電話",icon:"phone"},
  {id:"safari",name:"Safari",icon:"safari"},
  {id:"messages",name:"メッセージ",icon:"messages",badge:"89"},
  {id:"mail",name:"メール",icon:"mail"}
];

function iconHTML(app) {
  return `<button class="app-icon" data-app="${app.id}" aria-label="${app.name}">
    <span class="icon">${iconSvg[app.icon]}${app.badge?`<span class="badge">${app.badge}</span>`:""}</span>
    <span>${app.name}</span></button>`;
}
$("#appGrid").innerHTML=apps.map(iconHTML).join("");
$("#dock").innerHTML=dockApps.map(iconHTML).join("");

/* ロック解除 */
const screenIds=["lockScreen","passScreen","homeScreen","appScreen"];
let entered="";
function showScreen(id) {
  screenIds.forEach(s=>$("#"+s).classList.toggle("active",s===id));
  $("#lockWall").style.display=(id==="lockScreen"||id==="passScreen")?"":"none";
  $("#homeWall").style.display=(id==="homeScreen"||id==="appScreen")?"":"none";
  if(id!=="appScreen") $("#appScreen").classList.remove("instagram-mode");
}
const keys=["1","2","3","4","5","6","7","8","9","back","0","clear"];
$("#keypad").innerHTML=keys.map(k=>k==="back"
  ? `<button class="text-button" data-key="back" style="font-size:22px">⌫</button>`
  : k==="clear" ? `<button class="text-button" data-key="clear">消去</button>`
  : `<button class="key ${k==="0"?"zero":""}" data-key="${k}">${k}<small>${({2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"})[k]||""}</small></button>`
).join("");
function updateDots() {
  $("#dots").innerHTML=[0,1,2,3].map(i=>`<span class="dot ${i<entered.length?"filled":""}"></span>`).join("");
}
function enterKey(k) {
  if(k==="back") entered=entered.slice(0,-1);
  else if(k==="clear") entered="";
  else if(entered.length<4) entered+=k;
  $("#error").textContent="";
  updateDots();
  if(entered.length===4) {
    if(entered==="0629") setTimeout(()=>{entered="";showScreen("homeScreen");},170);
    else {
      $("#error").textContent="パスコードが違います";
      setTimeout(()=>{entered="";updateDots();},700);
    }
  }
}
$("#keypad").addEventListener("click",e=>{
  const key=e.target.closest("[data-key]")?.dataset.key;
  if(key) enterKey(key);
});
$("#lockScreen").addEventListener("click",()=>{entered="";updateDots();showScreen("passScreen");});
$("#cancelPass").onclick=()=>showScreen("lockScreen");
$("#emergency").onclick=()=>alert("ゲーム内のデモです。緊急通報は行いません。");
$("#homebar").onclick=()=>{
  if($("#appScreen").classList.contains("active")) showScreen("homeScreen");
  else if($("#passScreen").classList.contains("active")) showScreen("lockScreen");
};
let startY=0;
$("#phone").addEventListener("touchstart",e=>startY=e.touches[0].clientY,{passive:true});
$("#phone").addEventListener("touchend",e=>{
  if(startY-e.changedTouches[0].clientY>35 && $("#lockScreen").classList.contains("active")) {
    entered="";updateDots();showScreen("passScreen");
  }
},{passive:true});

/* 壁紙選択 */
function setWallpaper(input,selector) {
  input.addEventListener("change",()=>{
    const file=input.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>$(selector).style.backgroundImage=`url("${reader.result}")`;
    reader.readAsDataURL(file);
  });
}
setWallpaper($("#lockPicker"),"#lockWall");
setWallpaper($("#homePicker"),"#homeWall");

    body.innerHTML=`<div class="ig">
      <div class="ig-main">
        <div class="ig-profile">
          <div class="ig-username-row"><span>fs2xa__　⌄</span><span>＋　☰</span></div>
          <div class="ig-profile-top">
            <button class="ig-profile-avatar" id="chooseProfile" aria-label="プロフィール写真を選ぶ">${avatarMarkup()}</button>
            <div class="ig-stats">
              <div><b>${userPosts.length}</b>投稿</div>
              <div><b>1</b>フォロワー</div>
              <div><b>1</b>フォロー中</div>
            </div>
          </div>
          <div class="ig-name"><b>fs2xa__</b><br>日々の記録 ✨</div>
          <div class="ig-private">🔒 非公開アカウント<br>フォロワー：<b>@fm__629</b><br>フォロー中：<b>@fm__629</b></div>
          <div class="ig-profile-actions">
            <button id="editProfile">プロフィールを編集</button>
            <button>プロフィールをシェア</button>
          </div>
          <div class="ig-highlight-row">
            <div class="ig-highlight"><div class="ig-highlight-circle">＋</div>新規</div>
            <div class="ig-highlight"><div class="ig-highlight-circle">🌿</div>日常</div>

    </div>`;

    $("#editProfile").onclick=()=>$("#profilePicker").click();
    bindIgNav();
    return;
  }

  const posts = [
    ...userPosts,
    {src:"",caption:"今日の思い出 ☁️",owner:"fm__629",placeholder:"🌅"},

function bindIgNav() {
  $("#appBody").querySelectorAll("[data-ig]").forEach(button=>{
    button.onclick=()=>{
      const tab=button.dataset.ig;
      if(tab==="home"||tab==="dm"||tab==="profile") renderInstagram(tab);
    };
  });
  const modal=$("#storyModal");
  if(modal) {
    modal.querySelector("[data-close-story]")?.addEventListener("click",()=>modal.classList.remove("show"));
    modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show");});
  }
}
function openStory(name) {
  const modal=$("#storyModal");
  if(!modal)return;
  const content=$("#storyContent");
  content.innerHTML=`<div style="text-align:center;font-size:20px"><div style="font-size:65px;margin-bottom:15px">${name==="fm__629"?"🪻":"☁️"}</div>${escapeHTML(name)} のストーリー<br><small>ストーリーのデモ表示</small></div>`;
  modal.classList.add("show");
}
function readFile(file) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
$("#profilePicker").addEventListener("change",async()=>{
  const file=$("#profilePicker").files[0];
  if(!file||!file.type.startsWith("image/"))return;
  profileImage=await readFile(file);
  $("#profilePicker").value="";
  if($("#appScreen").classList.contains("active") && $("#appScreen").classList.contains("instagram-mode")) {
    renderInstagram(currentIgTab);
  }
});
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* 時計 */
function updateTime() {
  const now=new Date();
  const time=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  $("#clockStatus").textContent=time;
  $("#timeText").textContent=time;
  $("#dateText").textContent=now.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
  $("#homeDate").textContent=now.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
}
updateTime();
setInterval(updateTime,10000);
updateDots();
