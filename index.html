<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>My iPhone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:15px -apple-system,BlinkMacSystemFont,"Arial",sans-serif}.phone{max-width:420px;min-height:100dvh;margin:auto;background:linear-gradient(160deg,#26344b,#a9b7c9 75%,#dce1e8);padding:14px;position:relative}.status{display:flex;justify-content:space-between;font-weight:bold}.clock{text-align:center;margin:45px 0 35px;font-size:54px;font-weight:200}.date{text-align:center;margin-top:-32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;margin:30px 4px}.app{text-align:center;font-size:12px;cursor:pointer}.icon{width:58px;height:58px;border-radius:15px;margin:auto auto 5px;display:grid;place-items:center;font-size:31px;background:linear-gradient(145deg,#fff,#d8dce3);box-shadow:0 3px 8px #0004}.dock{position:absolute;bottom:16px;left:14px;right:14px;background:#ffffff55;border-radius:25px;padding:12px;display:flex;justify-content:space-around}.dock .icon{margin:0}.screen{position:absolute;inset:0;background:#f7f7f9;color:#222;padding:18px;overflow:auto;display:none}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:8px 0 14px;font-weight:bold}.back,button{cursor:pointer;border:0;border-radius:10px;padding:9px 12px;background:#e8e8ed;color:#222}.post,.bubble,.card{background:white;border-radius:14px;padding:13px;margin:12px 0;box-shadow:0 1px 4px #0001}.bubble{max-width:85%;background:#fee66d}.them{background:white}.row{display:flex;gap:7px;margin-top:10px}input{min-width:0;flex:1;padding:11px;border:1px solid #ccc;border-radius:10px}.muted{color:#777;font-size:13px}
</style><div class="phone"><div class="status"><span>9:41</span><span>●●●　◉</span></div><div class="clock">9:41</div><div class="date">11月2日 月曜日</div><div class="grid" id="grid"></div><div class="dock" id="dock"></div><section class="screen" id="screen"></section></div>
<script>
const apps=[["Instagram","📷"],["KakaoTalk","💬"],["X","𝕏"],["電話","📞"],["写真","🌄"],["カレンダー","🗓️"],["Safari","🧭"],["設定","⚙️"]];
let likes=50;const grid=document.querySelector("#grid"),dock=document.querySelector("#dock"),screen=document.querySelector("#screen");
function icon([n,e]){return `<div class="app" onclick="openApp('${n}')"><div class="icon">${e}</div>${n}</div>`}
grid.innerHTML=apps.slice(0,6).map(icon).join("");dock.innerHTML=apps.slice(6).map(icon).join("");
function openApp(n){screen.style.display="block";let body="";
if(n==="Instagram")body=`<div class="top"><span>Instagram</span><button onclick="igProfile()">プロフィール</button></div><div id="ig"><div class="post"><b>fm__629</b><p>今日もおつかれさま。空がきれいだった🌙</p><span class="muted">♡ いいね！　コメント</span></div><div class="post"><b>おすすめの投稿</b><p>ファンの投稿：最近、同じ場所で見かけた気がする…？</p></div><button onclick="igProfile()">投稿を見る</button></div>`;
if(n==="KakaoTalk")body=`<div class="top">KakaoTalk　🔒</div><div id="chat"><div class="bubble them">今日もおつかれさま。無理してない？</div><div class="bubble">大丈夫だよ！</div><div class="bubble them">よかった。落ち着いたらまた話そうね。</div></div><div class="row"><input id="msg" placeholder="メッセージ"><button onclick="send()">送信</button></div><p class="muted">好感度：<span id="love">${likes}</span></p>`;
if(n==="X")body=`<div class="top">𝕏　ホーム　🔔　DM</div><div class="post">ファンの投稿<p>最近ふうまくんと雰囲気似てる人いない？</p></div><div class="post">海外ファンのDM<p>혹시 후마랑 사귀세요?<br><span class="muted">（もしかしてフウマと付き合っていますか？）</span></p></div><div class="post">ファンの投稿<p>요즘 두 분 분위기가 이상해요<br><span class="muted">（最近2人の雰囲気が怪しいです）</span></p></div>`;
if(n==="電話")body=`<div class="top">電話</div><div class="card">ふうま　着信中…</div><button onclick="alert('もしもし？声が聞けてうれしい。')">応答</button>`;
if(n==="写真")body=`<div class="top">写真</div><div class="card">🌃<p>ふたりで見た夜景</p></div><div class="card">☕<p>秘密のカフェデート</p></div>`;
if(n==="カレンダー")body=`<div class="top">カレンダー</div><div class="card">今日の予定<p id="plans">ふうまとメッセージ</p></div><div class="row"><input id="plan" placeholder="予定を入力"><button onclick="addPlan()">追加</button></div>`;
if(n==="Safari"||n==="設定")body=`<div class="top">${n}</div><div class="card">この画面はデモです。</div>`;
screen.innerHTML=`<div class="top"><button class="back" onclick="screen.style.display='none'">‹ ホーム</button><span>${n}</span></div>${body}`}
function igProfile(){document.querySelector("#ig").innerHTML=`<div class="card"><b>fs2xo_ 🔒</b><p>非公開アカウント</p><p>フォロワー 1　フォロー中 1</p><p>フォロー中：fm__629</p></div>`}
function send(){let i=document.querySelector("#msg");if(!i.value.trim())return;document.querySelector("#chat").innerHTML+=`<div class="bubble">${i.value}</div><div class="bubble them">うん、聞いてるよ。ここではゆっくり話そう。</div>`;i.value="";likes++;document.querySelector("#love").textContent=likes}
function addPlan(){let i=document.querySelector("#plan");if(i.value.trim())document.querySelector("#plans").textContent+="・"+i.value;i.value=""}
</script></html>
