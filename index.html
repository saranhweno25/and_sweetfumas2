<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone風ミニゲーム</title>
<style>
:root {
  --lock-wall: linear-gradient(145deg,#26222d,#777080 42%,#1c1b25 76%,#48404f);
  --home-wall: linear-gradient(150deg,#4f5265,#a58a9b 45%,#272634 85%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: #101014; color: white;
}
.phone {
  position: relative; width: min(100vw, 430px); height: min(100dvh, 932px);
  overflow: hidden; background: #111; isolation: isolate;
}
@media (min-width: 500px) {
  .phone { border: 7px solid #29292d; border-radius: 52px; box-shadow: 0 20px 70px #0009; }
}
.wall {
  position: absolute; inset: 0; z-index: -2; background-size: cover;
  background-position: center; transition: background .25s;
}
.wall.lock { background: var(--lock-wall); }
.wall.home { background: var(--home-wall); }
.wall.lock::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(#08071222,#08071222);
}
.status {
  position: absolute; z-index: 10; top: 0; left: 0; right: 0; height: 46px;
  padding: 12px 25px 0; display: flex; justify-content: space-between;
  font-size: 14px; font-weight: 700; text-shadow: 0 1px 5px #0008;
}
.status .right { letter-spacing: 2px; }
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
#lockScreen { text-align: center; }
.lock-date { margin-top: 102px; font-size: 16px; text-shadow: 0 1px 8px #0008; }
.lock-time { font-size: clamp(68px, 19vw, 92px); line-height: 1.05; font-weight: 650; letter-spacing: -4px; }
.lock-hint { position: absolute; bottom: 90px; left: 0; right: 0; font-size: 14px; opacity: .9; }
.lock-shortcuts { position: absolute; bottom: 28px; left: 0; right: 0; display: flex; justify-content: space-around; }
.shortcut {
  border: 0; border-radius: 50%; width: 48px; height: 48px; color: white;
  background: #ffffff55; font-size: 21px;
}
.island {
  position: absolute; z-index: 12; top: 11px; left: 50%; transform: translateX(-50%);
  width: 115px; height: 32px; border-radius: 25px; background: #050505;
}
#passScreen {
  text-align: center; background: #08080b88; backdrop-filter: blur(22px);
}
.pass-title { margin-top: 150px; font-size: 19px; }
.dots { display:flex; justify-content:center; gap: 17px; margin: 23px 0 43px; }
.dot { width: 13px; height: 13px; border: 1.5px solid white; border-radius: 50%; }
.dot.filled { background: white; }
.keypad {
  width: 270px; margin: auto; display:grid; grid-template-columns:repeat(3,1fr);
  gap: 13px 14px;
}
.key {
  width: 78px; height: 78px; border:0; border-radius:50%;
  color:white; background:#ffffff37; font-size:34px; font-weight:300;
}
.key:active { background:#ffffff70; }
.key small { display:block; font-size:8px; font-weight:700; letter-spacing:2px; margin-top:-2px; }
.key.zero { grid-column:2; }
.pass-bottom {
  position:absolute; bottom: 66px; left:0; right:0; display:flex;
  justify-content:space-around; font-size:14px;
}
.text-button { border:0; background:none; color:white; font-size:14px; }
#error { height:20px; color:#ffb5b5; font-size:14px; margin-top:-33px; }
#homeScreen { padding: 65px 20px 24px; }
.widget {
  height: 112px; padding: 15px; margin: 0 0 23px; border-radius: 23px;
  background:#ffffff37; backdrop-filter:blur(16px); display:flex; align-items:center;
  justify-content:space-between; box-shadow:inset 0 0 0 1px #ffffff16;
}
.widget strong { font-size: 19px; }
.widget span { opacity:.86; font-size:13px; }
.app-grid { display:grid; grid-template-columns:repeat(4,1fr); gap: 20px 10px; }
.app-icon {
  border:0; background:none; color:white; display:flex; flex-direction:column;
  align-items:center; gap:5px; min-width:0; font-size:11px; text-shadow:0 1px 4px #000;
}
.icon {
  width:55px; height:55px; border-radius:15px; display:grid; place-items:center;
  font-size:28px; text-shadow:none; box-shadow:0 4px 12px #0003;
}
.dock {
  position:absolute; bottom:25px; left:14px; right:14px; height:83px;
  border-radius:27px; background:#ffffff38; backdrop-filter:blur(18px);
  display:flex; justify-content:space-around; align-items:center;
}
.dock .icon { width:52px; height:52px; }
#appScreen { background:#f5f5f7; color:#17171a; }
.app-top {
  height: 92px; padding: 53px 18px 10px; display:flex; align-items:center;
  justify-content:space-between; font-weight:700; font-size:18px;
}
.back { border:0; background:#e8e8eb; border-radius:50%; width:34px; height:34px; font-size:20px; }
.app-body { height:calc(100% - 125px); overflow:auto; padding:16px; }
.homebar {
  position:absolute; z-index:20; bottom:7px; left:50%; transform:translateX(-50%);
  width:135px; height:5px; background:white; border-radius:9px; cursor:pointer;
  box-shadow:0 1px 4px #0007;
}
#appScreen .homebar { background:#222; }
.card {
  background:white; border-radius:16px; padding:16px; margin-bottom:12px;
  box-shadow:0 1px 4px #0000000d;
}
.mock-button {
  border:0; border-radius:12px; padding:11px 15px; background:#3478f6;
  color:white; font-size:15px; margin:5px 5px 5px 0;
}
.field { width:100%; border:0; border-radius:12px; padding:13px; background:#eee; font-size:16px; }
.photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.photo-tile { aspect-ratio:1; border-radius:5px; background:linear-gradient(135deg,#c9a9a3,#55536d,#222); }
.ig-head { display:flex; justify-content:space-between; align-items:center; font-size:22px; font-weight:700; }
.story-row { display:flex; gap:12px; overflow:auto; padding:14px 0; }
.story { min-width:57px; text-align:center; font-size:10px; }
.story div { width:52px; height:52px; border-radius:50%; margin:auto auto 5px; background:linear-gradient(45deg,#f9b233,#de3980,#7355dc); padding:3px; }
.story i { display:block; width:100%; height:100%; border-radius:50%; background:#ddd; border:2px solid white; }
.post { background:white; border-radius:14px; overflow:hidden; margin-bottom:15px; }
.post-head { padding:11px; display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; }
.avatar { width:31px; height:31px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(45deg,#f7a,#fd5); }
.post-image { height:300px; display:grid; place-items:center; font-size:70px; background:linear-gradient(140deg,#dec9bf,#8b7786,#273141); }
.post-actions { padding:10px 12px; font-size:22px; }
.post-actions button { border:0; background:none; font-size:23px; padding:0 7px 0 0; }
.instagram-body { padding:12px; background:#fafafa; }
</style>
</head>
<body>
<main class="phone" id="phone">
  <div class="wall lock" id="lockWall"></div>
  <div class="wall home" id="homeWall" style="display:none"></div>
  <div class="status"><span id="clockStatus">9:41</span><span class="right">● ▮▮▮  Wi-Fi  ▰</span></div>
  <div class="island"></div>

  <section class="screen active" id="lockScreen">
    <div class="lock-date" id="dateText"></div>
    <div class="lock-time" id="timeText"></div>
    <div class="lock-hint">上にスワイプしてロックを解除</div>
    <div class="lock-shortcuts"><button class="shortcut">◉</button><button class="shortcut">▣</button></div>
  </section>

  <section class="screen" id="passScreen">
    <div class="pass-title">パスコードを入力</div>
    <div class="dots" id="dots"></div>
    <div id="error"></div>
    <div class="keypad" id="keypad"></div>
    <div class="pass-bottom">
      <button class="text-button" id="emergency">緊急</button>
      <button class="text-button" id="cancelPass">キャンセル</button>
    </div>
  </section>

  <section class="screen" id="homeScreen">
    <div class="widget"><div><strong>こんにちは</strong><br><span id="homeDate"></span></div><span>天気 ☀️ 22°</span></div>
    <div class="app-grid" id="appGrid"></div>
    <div class="dock" id="dock"></div>
  </section>

  <section class="screen" id="appScreen">
    <div class="app-top"><button class="back" id="backHome">‹</button><span id="appTitle"></span><span>•••</span></div>
    <div class="app-body" id="appBody"></div>
  </section>

  <div class="homebar" id="homebar"></div>
  <input type="file" id="lockPicker" accept="image/*" hidden>
  <input type="file" id="homePicker" accept="image/*" hidden>
</main>

<script>
const apps = [
  {id:"photos",name:"写真",icon:"🌸",color:"#fff",dock:false},
  {id:"camera",name:"カメラ",icon:"📷",color:"#333",dock:false},
  {id:"calendar",name:"カレンダー",icon:"📅",color:"#fff",dock:false},
  {id:"clock",name:"時計",icon:"🕘",color:"#fff",dock:false},
  {id:"settings",name:"設定",icon:"⚙️",color:"#9da3aa",dock:false},
  {id:"instagram",name:"Instagram",icon:"📸",color:"linear-gradient(135deg,#8358d8,#ee4266,#ffb04a)",dock:false},
  {id:"maps",name:"マップ",icon:"🗺️",color:"#d4efcf",dock:false},
  {id:"notes",name:"メモ",icon:"📝",color:"#ffe66d",dock:false},
  {id:"appstore",name:"App Store",icon:"A",color:"#1687f8",dock:false},
  {id:"music",name:"ミュージック",icon:"🎵",color:"#f24b65",dock:false},
  {id:"phone",name:"電話",icon:"📞",color:"#39c95b",dock:true},
  {id:"safari",name:"Safari",icon:"🧭",color:"#f7f7f7",dock:true},
  {id:"messages",name:"メッセージ",icon:"💬",color:"#34c759",dock:true},
  {id:"photos",name:"写真",icon:"🌸",color:"#fff",dock:true}
];
const $ = s => document.querySelector(s);
const screens = ["lockScreen","passScreen","homeScreen","appScreen"];
let entered = "";
function showScreen(id) {
  screens.forEach(s => $("#"+s).classList.toggle("active", s===id));
  $("#lockWall").style.display = id==="lockScreen" || id==="passScreen" ? "" : "none";
  $("#homeWall").style.display = id==="homeScreen" || id==="appScreen" ? "" : "none";
}
function makeIcon(a) {
  return `<button class="app-icon" data-app="${a.id}"><span class="icon" style="background:${a.color}">${a.icon}</span><span>${a.name}</span></button>`;
}
$("#appGrid").innerHTML = apps.filter(a=>!a.dock).map(makeIcon).join("");
$("#dock").innerHTML = apps.filter(a=>a.dock).map(a=>`<button class="app-icon" data-app="${a.id}" aria-label="${a.name}"><span class="icon" style="background:${a.color}">${a.icon}</span></button>`).join("");
const keys = ["1","2","3","4","5","6","7","8","9","back","0","clear"];
$("#keypad").innerHTML = keys.map(k => k==="back"
  ? `<button class="text-button" data-key="back" style="font-size:22px">⌫</button>`
  : k==="clear" ? `<button class="text-button" data-key="clear">消去</button>`
  : `<button class="key ${k==="0"?"zero":""}" data-key="${k}">${k}<small>${({2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"})[k]||""}</small></button>`
).join("");
function updateDots() {
  $("#dots").innerHTML = [0,1,2,3].map(i=>`<span class="dot ${i<entered.length?"filled":""}"></span>`).join("");
}
function keyInput(k) {
  if(k==="back") entered=entered.slice(0,-1);
  else if(k==="clear") entered="";
  else if(entered.length<4) entered+=k;
  $("#error").textContent="";
  updateDots();
  if(entered.length===4) {
    if(entered==="0629") {
      setTimeout(()=>{entered=""; showScreen("homeScreen");},180);
    } else {
      $("#error").textContent="パスコードが違います";
      setTimeout(()=>{entered="";updateDots();},700);
    }
  }
}
$("#keypad").addEventListener("click",e=>{const k=e.target.closest("[data-key]")?.dataset.key;if(k)keyInput(k);});
$("#lockScreen").addEventListener("click",()=>{entered="";updateDots();showScreen("passScreen");});
$("#cancelPass").onclick=()=>showScreen("lockScreen");
$("#emergency").onclick=()=>alert("ゲーム内のデモです。緊急通報は行いません。");
$("#appGrid").addEventListener("click",openApp);
$("#dock").addEventListener("click",openApp);
$("#backHome").onclick=()=>showScreen("homeScreen");
$("#homebar").onclick=()=> {
  if($("#appScreen").classList.contains("active")) showScreen("homeScreen");
  else if($("#passScreen").classList.contains("active")) showScreen("lockScreen");
};
let startY=0;
$("#phone").addEventListener("touchstart",e=>startY=e.touches[0].clientY,{passive:true});
$("#phone").addEventListener("touchend",e=>{
  if(startY-e.changedTouches[0].clientY>35 && $("#lockScreen").classList.contains("active")) {
    entered="";updateDots();showScreen("passScreen");
  }
},{passive:true});

function openApp(e) {
  const id=e.target.closest("[data-app]")?.dataset.app;
  if(!id)return;
  renderApp(id); showScreen("appScreen");
}
function renderApp(id) {
  const names={photos:"写真",camera:"カメラ",calendar:"カレンダー",clock:"時計",settings:"設定",instagram:"Instagram",maps:"マップ",notes:"メモ","appstore":"App Store",music:"ミュージック",phone:"電話",safari:"Safari",messages:"メッセージ"};
  $("#appTitle").textContent=names[id]||"アプリ";
  const body=$("#appBody");
  const views={
    settings:`<div class="card"><h3>壁紙</h3><p>ロック画面とホーム画面の画像を選べます。</p><button class="mock-button" onclick="document.querySelector('#lockPicker').click()">ロック画面を選ぶ</button><button class="mock-button" onclick="document.querySelector('#homePicker').click()">ホーム画面を選ぶ</button></div><div class="card">通知　　サウンド　　画面表示</div><p style="text-align:center;color:#777">このゲームのパスコードは 0629</p>`,
    instagram:`<div class="instagram-body"><div class="ig-head">Instagram <span>＋　♡　✉</span></div><div class="story-row">${["あなた","mika","haru","sora","yuki"].map((n,i)=>`<div class="story"><div><i></i></div>${n}</div>`).join("")}</div><div class="post"><div class="post-head"><span class="avatar">🌼</span> daily.mood　　•••</div><div class="post-image">🌅</div><div class="post-actions"><button class="like">♡</button><button>▢</button><button>➤</button><span style="float:right">♧</span><div style="font-size:13px;padding-top:5px">「いいね！」 いい一日になりますように ✨</div></div></div><div class="post"><div class="post-head"><span class="avatar">🐈</span> neko_days　　•••</div><div class="post-image" style="background:linear-gradient(130deg,#f3d2ad,#aaa4c5)">🐈</div><div class="post-actions"><button class="like">♡</button><button>▢</button><button>➤</button></div></div><nav style="display:flex;justify-content:space-around;padding:10px">⌂　⌕　＋　♡　●</nav></div>`,
    photos:`<div class="card"><h2>ライブラリ</h2><p>最近の項目　　選択</p><div class="photo-grid">${Array.from({length:12},(_,i)=>`<div class="photo-tile" style="background:linear-gradient(${i*35}deg,#d6b2a8,#77718c,#343342)"></div>`).join("")}</div></div>`,
    camera:`<div style="height:70%;background:linear-gradient(140deg,#37343c,#8d8190,#17171b);border-radius:20px;display:grid;place-items:center;font-size:40px">カメラ プレビュー</div><div style="text-align:center;padding:20px"><button class="mock-button" style="border-radius:50%;width:65px;height:65px;background:white" onclick="alert('撮影しました（デモ）')">●</button></div>`,
    calendar:`<div class="card"><h2>6月　2025</h2><p>月　火　水　木　金　土　日</p><p style="line-height:2.5">　　1　2　3　4　5　6　7<br>8　9　10　11　12　13　14<br>15　16　17　18　19　20　21<br>22　23　24　25　26　27　28<br>29　30</p></div><div class="card">今日の予定はありません</div>`,
    clock:`<div class="card" style="text-align:center;padding:45px 10px"><div style="font-size:58px">🕘</div><h2 id="liveClock">9:41</h2>世界時計　アラーム　ストップウォッチ　タイマー</div>`,
    maps:`<div style="height:70%;border-radius:18px;background:linear-gradient(30deg,#dce9d2,#f1e8ce,#d6e5ef);display:grid;place-items:center;color:#555;font-size:25px">🗺️<br><small>地図のデモ画面</small></div><input class="field" placeholder="場所を検索">`,
    notes:`<textarea class="field" style="height:70%;resize:none" placeholder="メモを入力…"></textarea>`,
    appstore:`<div class="card"><h2>見つけよう</h2><input class="field" placeholder="ゲーム、アプリを検索"><p>おすすめアプリ</p>📱　便利なアプリを探す</div>`,
    music:`<div class="card" style="text-align:center;padding:50px 15px"><div style="font-size:70px">🎵</div><h2>ミュージック</h2><p>お気に入りの曲を再生</p><button class="mock-button" onclick="this.textContent=this.textContent==='▶ 再生'?'⏸ 一時停止':'▶ 再生'">▶ 再生</button></div>`,
    phone:`<div class="card"><input class="field" placeholder="連絡先を検索"><h3>よく使う項目</h3><p>👤　デモ連絡先</p><div style="text-align:center;font-size:24px;line-height:2.5">1　　2　　3<br>4　　5　　6<br>7　　8　　9<br>*　　0　　#</div><button class="mock-button">📞 通話（デモ）</button></div>`,
    safari:`<input class="field" placeholder="検索またはWebサイト名を入力"><div class="card" style="margin-top:18px;text-align:center"><h2>お気に入り</h2>よく見るサイトをここに表示します</div>`,
    messages:`<div class="card"><h2>メッセージ</h2><input class="field" placeholder="検索"><p>👤　あおい　　こんにちは！</p><hr><p>👤　家族　　　またあとでね</p><hr><p>👤　ゆう　　　写真ありがとう</p></div>`
  };
  body.innerHTML=views[id]||`<div class="card">${names[id]} のデモ画面</div>`;
  body.querySelectorAll(".like").forEach(b=>b.onclick=()=>b.textContent=b.textContent==="♡"?"♥":"♡");
}
function setWallpaper(input,selector) {
  input.addEventListener("change",()=>{
    const file=input.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>document.querySelector(selector).style.backgroundImage=`url("${reader.result}")`;
    reader.readAsDataURL(file);
  });
}
setWallpaper($("#lockPicker"),"#lockWall");
setWallpaper($("#homePicker"),"#homeWall");

function updateTime() {
  const now=new Date();
  $("#clockStatus").textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  $("#timeText").textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  $("#dateText").textContent=now.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
  $("#homeDate").textContent=now.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
}
updateTime(); setInterval(updateTime,10000);
updateDots();
</script>
</body>
</html>
